# Dev container services: the workspace container plus a local PostgreSQL that stands in
# for Azure PostgreSQL (chats, boards, jobs). Local credentials are throwaway dev values.
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/framebase:cached
    environment:
      DATABASE_URL: postgres://framebase:framebase@db:5432/framebase
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: framebase
      POSTGRES_PASSWORD: framebase
      POSTGRES_DB: framebase
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framebase -d framebase"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
